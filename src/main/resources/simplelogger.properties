# Library logging is diagnostic noise on stderr; the server's own log stream is the MCP one.
# Raise with -Dorg.slf4j.simpleLogger.defaultLogLevel=debug when debugging the SDK itself.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
